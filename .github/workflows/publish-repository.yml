name: Publish repository

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish; leave blank to use the latest release
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid four-part release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download existing release plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _download _site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Resonance-$VERSION.zip" \
            --dir _download
          test -f "_download/Resonance-$VERSION.zip"
          cp "_download/Resonance-$VERSION.zip" _site/Resonance.zip
          unzip -p _site/Resonance.zip Resonance.json > _site/Resonance.json

      - name: Build and validate Dalamud repository feed
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '.AssemblyVersion' _site/Resonance.json)"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match plugin manifest version $manifest_version" >&2
            exit 1
          fi
          download_url="https://slobodaapl.github.io/resonance/Resonance.zip"
          jq \
            --arg version "$VERSION" \
            --arg download "$download_url" \
            '. + {
              AssemblyVersion: $version,
              TestingAssemblyVersion: $version,
              DownloadLinkInstall: $download,
              DownloadLinkUpdate: $download,
              DownloadLinkTesting: $download
            } | [.]' \
            _site/Resonance.json > _site/repo.json
          rm _site/Resonance.json
          jq -e '
            type == "array" and
            length == 1 and
            .[0].AssemblyVersion == $version and
            .[0].DownloadLinkInstall == $download
          ' --arg version "$VERSION" --arg download "$download_url" _site/repo.json >/dev/null

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
